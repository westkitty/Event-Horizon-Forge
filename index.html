<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Event Horizon Forge</title>
    <style>
      :root {
        --ehf-ink: rgba(226, 232, 240, 0.94);
        --ehf-dim: rgba(148, 163, 184, 0.74);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--ehf-ink);
        font: 400 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
        touch-action: none;
        outline: none;
      }
      #scene:focus-visible {
        outline: 2px solid rgba(147, 197, 253, 0.92);
        outline-offset: -4px;
      }
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100dvh;
        place-content: center;
        gap: 14px;
        justify-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #000;
        z-index: 100;
        transition: opacity 420ms ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .mark {
        font: 300 11px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--ehf-dim);
        text-indent: 0.42em;
      }
      #boot .bar {
        width: min(168px, 52vw);
        height: 2px;
        background: rgba(148, 163, 184, 0.18);
        overflow: hidden;
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: rgba(226, 232, 240, 0.88);
        transition: width 220ms ease;
      }
      #boot .why {
        min-height: 1.5em;
        font-size: 11px;
        color: rgba(148, 163, 184, 0.62);
        max-width: 34ch;
        text-align: center;
        overflow-wrap: anywhere;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot .bar > i { transition: none; }
      }
      @media (forced-colors: active) {
        #scene:focus-visible { outline-color: Highlight; }
        #boot { background: Canvas; color: CanvasText; }
        #boot .bar { border: 1px solid ButtonText; background: Canvas; }
        #boot .bar > i { background: Highlight; }
      }
    </style>
  </head>
  <body>
    <canvas
      id="scene"
      tabindex="0"
      aria-label="Interactive Event Horizon Forge cosmic simulation. Use keyboard, pointer, or touch controls to manipulate the scene."
    ></canvas>
    <div id="overlay"></div>
    <div id="boot" role="status" aria-live="polite" aria-atomic="true">
      <div class="mark">Event Horizon Forge</div>
      <div
        class="bar"
        id="boot-progress"
        role="progressbar"
        aria-label="Loading Event Horizon Forge"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      ><i id="boot-bar"></i></div>
      <div class="why" id="boot-why"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
