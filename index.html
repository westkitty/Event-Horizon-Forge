<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Event Horizon Forge</title>
    <style>
      /*
        Zero-chrome default (BUILD_SPEC 25.1, INV-001).
        Nothing here may render persistent text, panels, or controls.
      */
      :root {
        --ehf-ink: rgba(226, 232, 240, 0.92);
        --ehf-dim: rgba(148, 163, 184, 0.72);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--ehf-ink);
        font: 400 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        touch-action: none;
      }
      #scene {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
      }
      /* Overlay root is inert by default; only revealed controls opt back in. */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      /* Restrained boot state. Leaves the viewport entirely once the scene owns it. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: #000;
        z-index: 100;
        transition: opacity 900ms ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .mark {
        font: 300 11px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--ehf-dim);
        text-indent: 0.42em;
      }
      #boot .bar {
        width: 168px;
        height: 1px;
        background: rgba(148, 163, 184, 0.18);
        overflow: hidden;
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: rgba(226, 232, 240, 0.85);
        transition: width 320ms ease;
      }
      #boot .why {
        font-size: 11px;
        color: rgba(148, 163, 184, 0.5);
        max-width: 30ch;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot .bar > i { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay" aria-live="polite"></div>
    <div id="boot">
      <div class="mark">Event Horizon Forge</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="why" id="boot-why"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
